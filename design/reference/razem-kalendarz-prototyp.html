<style>

.popover{position:fixed;z-index:80;right:clamp(15px,5vw,80px);top:78px;background:#FBF1FF;border:1px solid #D6B8EF;box-shadow:0 20px 48px #57208e35;border-radius:20px;width:min(360px,calc(100vw - 35px));padding:18px;display:none}.popover.open{display:block}.popover h3{font-size:16px;margin:0 0 10px}.popover-item{padding:11px 0;border-top:1px solid #E9D5F6;font-size:12px;color:#76518F}.overlay{position:fixed;inset:0;background:#38194c99;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}.overlay.open{display:flex}.modal{background:#FAEFFF;border:1px solid #DEBDF4;border-radius:27px;padding:27px;width:min(500px,100%);box-shadow:0 30px 70px #36144d55;max-height:90vh;overflow:auto;animation:modalIn .2s ease}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal h2{font-size:22px;margin:0;letter-spacing:-.6px}.modal p{color:#84609B;font-size:12px;margin:9px 0 18px}.form-field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.form-field label{font-size:12px;font-weight:800;color:#69398B}.form-field input,.form-field select{height:44px;width:100%;background:#fff9ff;border:1px solid #D9BCEB;border-radius:11px;padding:0 12px;color:#3D185C}.form-duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:21px}.toast{position:fixed;z-index:150;bottom:24px;right:24px;background:#572585;color:white;border-radius:13px;padding:13px 18px;box-shadow:0 15px 36px #56278044;font-size:13px;font-weight:700;opacity:0;transform:translateY(16px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:none}.heart-particle{position:fixed;z-index:200;color:#FF4FA3;pointer-events:none;animation:particleUp 1.1s ease-out forwards}.heart-particle svg{width:21px;height:21px;fill:currentColor;stroke-width:1}.heart-particle.alt{color:#C777E8}@keyframes particleUp{0%{opacity:1;transform:translate3d(0,0,0) scale(.65) rotate(-1 @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}body.reduce-motion *,body.reduce-motion *:before,body.reduce-motion *:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
/* Calendar controls and the layout of the calendar page */
button, select, input, textarea { -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
[hidden] { display: none !important; }
.skip-link { position: fixed; z-index: 300; top: 8px; left: 8px; transform: translateY(-160%); }
.skip-link:focus { transform: none; }
.nav-item[aria-disabled="true"] { cursor: default; }
.nav-item[aria-disabled="true"]:hover .nav-tile { background: var(--tile); transform: none; box-shadow: none; }
.nav-item[aria-disabled="true"] .nav-label { color: #F8EFFF; }
.topbar { position: relative; }
.account-button { display: inline-flex; align-items: center; gap: 7px; background: transparent; border: 0; padding: 0 3px; border-radius: 13px; font-size: 12px; font-weight: 750; color: #693995; }
.account-button .avatar { border-color: var(--bg); width: 36px; height: 36px; font-size: 13px; margin: 0; }
.avatar.oliwia { background: #FFC1E2; color: #8E2C64; }
.account-button:hover .avatar { box-shadow: 0 0 0 2px #C49BF0; }
.mobile-toggle, .mobile-scrim { display: none; }
.pagehead { margin-bottom: 18px; }
.pagehead .headline { display: flex; align-items: center; gap: 9px; }
.headline .icon { color: #AD66E9; width: .56em; height: .56em; }
.header-actions { display: flex; flex-wrap: wrap; gap: 9px; }
.btn.pink { color: #351349; }
.btn.pink:hover { background: #FF70B5; }
.btn:disabled { transform: none; box-shadow: none; }
.date-title { min-width: 0; width: auto; padding: 0 7px; }
.date-nav { min-width: 0; }
.date-nav .arrow-btn, .date-nav .btn { flex: none; }
.date-nav .arrow-btn { width: 36px; height: 36px; }
.date-nav .btn { min-height: 36px; }
.calendar-top { margin-top: 0; }
.legend-marker { flex: none; }
.legend-chip { color: #643988; }
.legend-chip .icon { color: #AA326E; width: 14px; height: 14px; }
.calendar-filters { margin-bottom: 15px; }
.calendar-filters .filter-chip { font-size: 12px; min-height: 34px; }
.filter-label { font-size: 12px; }
.calendar-filters .availability-button { margin-left: auto; }
.calendar-surface { min-height: 0; }
.calendar-surface:focus { outline: 0; }
.calendar-surface.is-changing { animation: pageIn .24s both; }
.state-line { color: #724894; margin: 12px 2px 0; font-size: 12px; display: flex; align-items: center; gap: 6px; }
.state-line .icon { color: #A758AF; width: 16px; height: 16px; }
.state-line:empty { display: none; }
/* Week and month */
.week-day { position: relative; }
.week-head { width: 100%; }
.week-day:hover, .week-day:focus-within { flex: 1.45 1 0; border-color: #C69EF2; }
.week-board:has(.week-day:hover) .week-day:not(:hover) { opacity: .68; }
.week-day:focus-within { opacity: 1 !important; }
.week-head, .text-action { border: 0; padding: 0; background: transparent; color: inherit; text-align: left; }
.week-head { border-bottom: 1px solid #E7D0F5; padding-bottom: 12px; }
.week-head:hover .week-name, .text-action:hover { text-decoration: underline; }
.week-head .week-num { display: block; }
.week-event { width: 100%; border-top: 0; border-right: 0; border-bottom: 0; text-align: left; color: #422060; transition: filter .18s, box-shadow .18s; }
.week-event:hover, .day-event:hover, .all-day-event:hover { filter: saturate(1.2); box-shadow: 0 4px 12px #67378c25; }
.week-event strong { font-size: clamp(11px, .92vw, 13px); }
.week-event .event-time { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 650; color: #69417D; white-space: normal; }
.event-time .icon { width: 13px; height: 13px; }
.event-time .star { margin-left: auto; color: #AD2D72; }
.week-event .who { font-size: 9px; }
.week-foot { opacity: 1; padding-top: 0; border: 0; background: transparent; text-align: center; margin-top: auto; color: #744495; font-size: 11px; align-self: stretch; min-height: 30px; font-weight: 750; }
.week-foot:hover { text-decoration: underline; }
.week-events { margin-bottom: 10px; }
.empty-week { color: #825A99; margin: 16px 0 auto; }
.month-cell { color: var(--ink); }
.month-date { font-size: 14px; }
.month-mini { min-height: 18px; }
.month-priority-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

<script>
(() => {
  'use strict';

  const $ = (selector, parent = document) => parent.querySelector(selector);
  const $$ = (selector, parent = document) => [...parent.querySelectorAll(selector)];
  const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
  const icon = (name, cls = 'sm') => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
  const localDate = (year, month, day) => new Date(Date.UTC(year, month, day));
  const parseDate = value => {
    const [year, month, day] = value.split('-').map(Number);
    return localDate(year, month - 1, day);
  };
  const dateKey = date => date.toISOString().slice(0, 10);
  const addDays = (date, days) => localDate(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate() + days);
  const monday = date => addDays(date, -((date.getUTCDay() + 6) % 7));
  const formatDate = (date, options) => new Intl.DateTimeFormat('pl-PL', {
    ...options, timeZone: 'UTC'
  }).format(date);
  const todayParts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Europe/Warsaw', year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(new Date());
  const getPart = name => todayParts.find(part => part.type === name).value;
  const todayKey = [getPart('year'), getPart('month'), getPart('day')].join('-');
  const today = parseDate(todayKey);
  const fullDate = date => formatDate(date, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const shortDate = date => formatDate(date, { day: 'numeric', month: 'short' });
  const capital = value => value.charAt(0).toUpperCase() + value.slice(1);
  const minutes = value => {
    const [hours, mins] = value.split(':').map(Number);
    return hours * 60 + mins;
  };
  const pad = value => String(value).padStart(2, '0');
  const hourText = value => `${pad(Math.floor(value / 60))}:${pad(value % 60)}`;
  const durationText = value => value < 60 ? `${value} min` : `${Math.floor(value / 60)} godz.${value % 60 ? ` ${value % 60} min` : ''}`;

  const names = { szymek: 'Szymek', oliwia: 'Oliwia', shared: 'Razem' };
  const tones = { szymek: 'you', oliwia: 'her', shared: 'shared' };
  const calendarNames = { agh: 'AGH', ur: 'UR', uken: 'UKEN', plans: 'Plany ręczne', dates: 'Ważne daty' };
  const kinds = {
    plan: { name: 'Plan osobisty', icon: 'calendar' },
    study: { name: 'Zajęcia', icon: 'book' },
    date: { name: 'Randka', icon: 'heart' },
    meeting: { name: 'Spotkanie', icon: 'coffee' },
    travel: { name: 'Wyjazd', icon: 'plane' },
    occasion: { name: 'Ważna data', icon: 'star' }
  };
  const reminders = { none: 'Brak', '15': '15 minut wcześniej', '60': 'Godzinę wcześniej', '1440': 'Dzień wcześniej' };
  const weekdays = ['Pon', 'Wt', 'Śr', 'Czw', 'Pt', 'Sob', 'Nd'];
  const courseTypes = {
    W: 'Wykłady', CWL: 'Laboratoria', CWA: 'Ćwiczenia', CWP: 'Projekty', LEKT: 'Lektorat', WF: 'WF'
  };
  const universityOwner = { agh: 'szymek', ur: 'oliwia', uken: 'oliwia' };
  let selectedUniversity = 'agh';
  const courses = [];

  const storageKey = 'razem.kalendarz.pusty.1';
  let storageAvailable = true;
  function loadData() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (saved?.version === 1 && Array.isArray(saved.entries) && Array.isArray(saved.hidden) &&
          /^\d{4}-\d{2}-\d{2}$/.test(saved.anchor) && ['szymek', 'oliwia'].includes(saved.account)) return saved;
    } catch { /* An empty calendar is shown if storage is unavailable. */ }
    return { version: 1, anchor: todayKey, entries: [], hidden: [],
      account: 'szymek' };
  }

  const data = loadData();
  const activeCalendars = new Set();
  let view = 'week';
  let cursor = today;
  let highlightFree = true;
  let toastTimer;
  let returnFocus = null;
  const body = $('#calendarBody');
  const dialog = $('#dialog');
  const anchorWeek = monday(parseDate(data.anchor));

  function saveData() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(data));
    } catch {
      storageAvailable = false;
    }
  }

  function sourceEntries() {
    return courses.filter(course => !course.university).flatMap(course => course.terms.map(([id, day, baseStart, baseEnd]) => {
      return {
        id, date: dateKey(addDays(anchorWeek, day)), start: baseStart,
        end: baseEnd, owner: universityOwner[course.university || 'agh'], calendar: course.university || 'agh', kind: 'study',
        title: course.name, important: false, allDay: false, blocking: true, author: 'usos',
        place: '', description: '', reminder: 'none', course: course.id, courseType: course.type,
        group: course.group
      };
    }));
  }

  function allEntries() {
    const hidden = new Set(data.hidden);
    return [...data.entries, ...sourceEntries().filter(item => !hidden.has(item.id))];
  }

  function matchesVisibleCalendar(item) {
    return activeCalendars.size === 0 || activeCalendars.has(item.calendar);
  }

  function orderEntries(a, b) {
    return Number(b.allDay) - Number(a.allDay) || a.start.localeCompare(b.start) ||
      Number(b.important) - Number(a.important) || a.title.localeCompare(b.title, 'pl');
  }

  function entriesByDay(entries) {
    const grouped = new Map();
    for (const item of entries) {
      if (!grouped.has(item.date)) grouped.set(item.date, []);
      grouped.get(item.date).push(item);
    }
    for (const items of grouped.values()) items.sort(orderEntries);
    return grouped;
  }

  const byCalendarRange = (item, day) => item.date === day;
  const itemTime = item => item.allDay ? 'Cały dzień' : `${item.start}–${item.end}`;
  const itemLabel = item => `${item.title}, ${names[item.owner]}, ${itemTime(item)}${item.important ? ', ważne' : ''}`;
  const itemIcon = item => icon(kinds[item.kind]?.icon || 'calendar');
  const importantIcon = item => item.important ? icon('star', 'star') : '';
  const avatar = person => `<span class="avatar ${person === 'oliwia' ? 'oliwia' : ''}" aria-hidden="true">${names[person][0]}</span>`;

  function headerDate() {
    if (view === 'day') return fullDate(cursor);
    if (view === 'month') return formatDate(cursor, { month: 'long', year: 'numeric' });
    const first = monday(cursor);
    const last = addDays(first, 6);
    if (first.getUTCMonth() === last.getUTCMonth()) {
      return `${first.getUTCDate()}–${formatDate(last, { day: 'numeric', month: 'long', year: 'numeric' })}`;
    }
    return `${shortDate(first)} – ${formatDate(last, { day: 'numeric', month: 'short', year: 'numeric' })}`;
  }

  function accent(item) {
    return /^#[0-9a-f]{6}$/i.test(item.color || '') ? `border-left-color:${item.color};background:color-mix(in srgb,${item.color} 24%,#fff);` : '';
  }

  function weekHTML(days) {
    const first = monday(cursor);
    const dates = weekdays.map((_, index) => addDays(first, index));
    const timed = dates.flatMap(date => days.get(dateKey(date)) || []).filter(item => !item.allDay);
    const from = Math.min(8, ...timed.map(item => Math.floor(minutes(item.start) / 60)));
    const to = Math.max(20, ...timed.map(item => Math.ceil(minutes(item.end) / 60)));
    const hours = Array.from({length: to - from}, (_, index) => from + index);
    const height = 64;
    return `<div class="week-scroll"><div class="week-board timed-week" style="--week-hour:${height}px">
      <div class="week-axis" aria-hidden="true"><div class="week-axis-head">Godz.</div>
      ${hours.map(hour => `<div>${hourText(hour * 60)}</div>`).join('')}</div>
      ${dates.map((date,index) => {
        const key = dateKey(date);
        const items = days.get(key) || [];
        const positioned = dayPositions(items.filter(item => !item.allDay));
        return `<article class="week-day ${key === todayKey ? 'is-today' : ''}">
          <button class="week-head" type="button" data-open-day="${key}" aria-label="Otwórz dzień, ${fullDate(date)}">
            <span class="week-name">${weekdays[index]}</span><span class="week-num">${date.getUTCDate()}</span>
          </button>
          <div class="week-people"><span title="Szymek"><i aria-hidden="true">S</i><b>Szymek</b></span><span title="Oliwusia"><i aria-hidden="true">O</i><b>Oliwusia</b></span></div>
          <div class="week-all-day">${items.filter(item => item.allDay).map(item => `<button type="button" data-event="${item.id}" class="month-mini ${tones[item.owner]}" title="${escape(itemLabel(item))}" style="${accent(item)}">${item.important ? '★ ' : ''}${escape(item.title)}</button>`).join('')}</div>
          <div class="week-hours" style="height:${hours.length * height}px">
          ${positioned.map(({item,left,width}) => {
            const top = (minutes(item.start) / 60 - from) * height;
            const h = (minutes(item.end) - minutes(item.start)) / 60 * height;
            return `<button type="button" class="week-event ${tones[item.owner]} week-timed" data-event="${item.id}"
              style="top:${top}px;height:${Math.max(8,h - 1)}px;left:${left}%;width:${width}%;${accent(item)}" title="${escape(itemLabel(item))}" aria-label="${escape(itemLabel(item))}">
              <small class="event-time"><span>${item.start}</span><span class="week-end">–${item.end}</span></small><strong>${item.important ? '★ ' : ''}${escape(item.title)}</strong>
            </button>`;
          }).join('')}</div>
        </article>`;
      }).join('')}</div></div>`;
  }

  function monthAgenda(days) {
    const items = days.get(dateKey(cursor)) || [];
    return `<section class="month-agenda"><div class="agenda-head"><h2>${capital(fullDate(cursor))}</h2>
      <button type="button" class="btn soft small" data-open-day="${dateKey(cursor)}">Otwórz dzień</button></div>
      ${items.length ? `<div class="agenda-items">${items.map(item => `<button type="button" class="week-event ${tones[item.owner]}" data-event="${item.id}" style="${accent(item)}">
        <small>${itemTime(item)} · ${names[item.owner]} · ${calendarNames[item.calendar]}</small><strong>${item.important ? '★ ' : ''}${escape(item.title)}</strong></button>`).join('')}</div>` : '<p>Brak wydarzeń na wybraną datę.</p>'}</section>`;
  }

  function monthHTML(days) {
    const month = cursor.getUTCMonth();
    const year = cursor.getUTCFullYear();
    const first = localDate(year, month, 1);
    const start = monday(first);
    const dayCount = localDate(year, month + 1, 0).getUTCDate();
    const gridCount = 7 * Math.ceil((dayCount + (first.getUTCDay() + 6) % 7) / 7);
    const cells = Array.from({ length: gridCount }, (_, index) => {
      const date = addDays(start, index);
      const key = dateKey(date);
      const entries = days.get(key) || [];
      const important = entries.filter(item => item.important);
      const label = [fullDate(date), ...entries.map(item => itemLabel(item))].join(', ');
      return `<button class="month-cell ${date.getUTCMonth() !== month ? 'other' : ''} ${important.length ? 'priority' : ''} ${key === todayKey ? 'today' : ''}"
          type="button" data-month-day="${key}" aria-pressed="${key === dateKey(cursor)}" aria-label="${escape(label)}" ${key === todayKey ? 'aria-current="date"' : ''}>
        <span class="month-cell-head"><span class="month-date">${date.getUTCDate()}</span>
          ${important.length ? `<span class="month-priority">${icon('star')}</span>` : ''}
        </span>
        <span class="month-counts">${['szymek','oliwia','shared'].map(owner => {
          const count = entries.filter(item => item.owner === owner).length;
          return count ? `<span class="month-mini ${tones[owner]}" title="${names[owner]}: ${count}">${names[owner][0]} ${count}</span>` : '';
        }).join('')}</span>
        ${important[0] ? `<span class="month-priority-label">${escape(important[0].title)}</span>` : ''}
      </button>`;
    });
    return `<div class="month-weekdays" aria-hidden="true">${weekdays.map(day => `<div>${day}</div>`).join('')}</div><div class="month-grid">${cells.join('')}</div>${monthAgenda(days)}`;
  }

  function freeIntervals(items, from, to, minimum) {
    const busy = items.filter(item => item.blocking).map(item => item.allDay
      ? [from, to]
      : [Math.max(from, minutes(item.start)), Math.min(to, minutes(item.end))])
      .filter(([start, end]) => end > start)
      .sort((a, b) => a[0] - b[0]);
    const free = [];
    let next = from;
    for (const [start, end] of busy) {
      if (start - next >= minimum) free.push({ start: next, end: start });
      next = Math.max(next, end);
    }
    if (to - next >= minimum) free.push({ start: next, end: to });
    return free;
  }

  function timeGroups(items) {
    const ordered = [...items].sort((a, b) => a.start.localeCompare(b.start) || b.end.localeCompare(a.end));
    const groups = [];
    let lastEnd = '';
    for (const item of ordered) {
      if (item.start >= lastEnd) {
        groups.push([]);
        lastEnd = item.end;
      }
      groups.at(-1).push(item);
      if (item.end > lastEnd) lastEnd = item.end;
    }
    return groups;
  }

  function spread(items, left, width) {
    const laneEnds = [];
    const placed = items.map(item => {
      let column = laneEnds.findIndex(end => end <= item.start);
      if (column < 0) column = laneEnds.length;
      laneEnds[column] = item.end;
      return { item, column };
    });
    const columnWidth = width / laneEnds.length || width;
    return placed.map(({ item, column }) => ({ item, left: left + columnWidth * column, width: columnWidth }));
  }

  function dayPositions(items) {
    return timeGroups(items).flatMap(group => {
      const shared = group.filter(item => item.owner === 'shared');
      if (group.length === 1 && shared.length) return [{ item: shared[0], left: 0, width: 100 }];
      const yourWidth = shared.length ? 34 : 50;
      return [
        ...spread(group.filter(item => item.owner === 'szymek'), 0, yourWidth),
        ...spread(shared, yourWidth, 100 - 2 * yourWidth),
        ...spread(group.filter(item => item.owner === 'oliwia'), 100 - yourWidth, yourWidth)
      ];
    });
  }

  function dayHTML(visible, all) {
    const key = dateKey(cursor);
    const timed = visible.filter(item => !item.allDay);
    const allDay = visible.filter(item => item.allDay);
    const first = Math.min(8, ...timed.map(item => Math.floor(minutes(item.start) / 60)));
    const last = Math.max(20, ...timed.map(item => Math.ceil(minutes(item.end) / 60)));
    const hourHeight = 46;
    const origin = first * 60;
    const position = min => (min - origin) / 60 * hourHeight;
    const hours = Array.from({ length: last - first }, (_, index) => first + index);
    const slots = freeIntervals(all, origin, last * 60, 30);
    const longest = [...slots].sort((a, b) => b.end - b.start - (a.end - a.start)).slice(0, 3).sort((a, b) => a.start - b.start);
    const slotButtons = longest.map(({ start, end }) => `<button class="free-chip" data-free-slot="${start}" data-slot-end="${end}" type="button"
      aria-label="Dodaj wspólne wydarzenie, wolne od ${hourText(start)} do ${hourText(end)}">${hourText(start)}–${hourText(end)}</button>`).join('');
    const freeBands = slots.map(({ start, end }) => `<div class="free-band" aria-hidden="true"
      style="top:${position(start)}px;height:${position(end)-position(start)}px"></div>`).join('');
    const allDayGroup = (owner, items = allDay.filter(item => item.owner === owner)) => `<div class="all-day-group ${tones[owner]}">
      ${items.map(item => `<button class="all-day-event ${tones[item.owner]}" data-event="${item.id}" type="button" style="${accent(item)}" aria-label="${escape(itemLabel(item))}">
        ${itemIcon(item)}<span>${escape(item.title)}</span>${importantIcon(item)}
      </button>`).join('')}</div>`;
    const eventButtons = dayPositions(timed).map(({ item, left, width }) => {
      const top = position(minutes(item.start));
      const height = Math.max(10, position(minutes(item.end)) - top - 3);
      const short = height < 31;
      return `<button class="day-event ${tones[item.owner]} ${width < 100 ? 'in-lane' : ''} ${short ? 'micro' : ''}"
        style="top:${top + 1}px;height:${height}px;left:calc(${left}% + 4px);width:calc(${width}% - 8px);right:auto;${accent(item)}"
        type="button" data-event="${item.id}" aria-label="${escape(itemLabel(item))}" title="${escape(itemLabel(item))}">
        <strong>${escape(item.title)}</strong>
        <span class="event-time">${itemIcon(item)}${itemTime(item)}${importantIcon(item)}</span>
      </button>`;
    }).join('');
    const lane = owner => `<div class="schedule-lane"><div class="schedule-slots">
      ${hours.map(hour => `<button class="hour-cell" type="button" data-add-hour="${hour}" data-owner="${owner}"
        aria-label="Dodaj wydarzenie, ${names[owner]}, ${hourText(hour * 60)}">${icon('plus')}</button>`).join('')}
    </div></div>`;
    const emptyNote = visible.length ? '' : '<p class="day-empty-note">Brak wydarzeń w wybranych kalendarzach.</p>';
    return `<div class="day-tools">
        <label><input type="checkbox" id="highlightFree" ${highlightFree ? 'checked' : ''}> Pokaż wolne razem</label>
        <div class="free-slot-list">${highlightFree ? slotButtons || '<span class="state-line">Brak wspólnego wolnego od 30 min</span>' : ''}</div>
      </div>
      <div class="day-layout" style="--hour:${hourHeight}px">
        <div class="time-top">Godz.</div>
        <div class="day-colhead you">${avatar('szymek')} Szymek</div>
        <div class="day-colhead her">${avatar('oliwia')} Oliwia</div>
        ${allDay.length ? `<div class="all-day-row"><div class="all-day-label">Cały dzień</div>
          ${allDayGroup('szymek')}${allDayGroup('oliwia')}${allDay.some(item => item.owner === 'shared') ? allDayGroup('shared') : ''}</div>` : ''}
        <div class="time-axis calendar-time-axis" aria-hidden="true">${hours.map(hour => `<div class="time-label">${hourText(hour * 60)}</div>`).join('')}</div>
        <div class="schedule-plot">${lane('szymek')}${lane('oliwia')}${highlightFree ? freeBands : ''}<div class="span-layer">${eventButtons}</div></div>
      </div>${emptyNote}`;
  }

  function renderCalendar(animate = false) {
    const entries = allEntries();
    const visible = entriesByDay(entries.filter(matchesVisibleCalendar));
    const key = dateKey(cursor);
    $('#dateTitle').textContent = capital(headerDate());
    $$('[data-view]').forEach(button => {
      const selected = button.dataset.view === view;
      button.classList.toggle('active', selected);
      button.setAttribute('aria-pressed', selected);
    });
    $$('[data-calendar-filter]').forEach(button => {
      const filter = button.dataset.calendarFilter;
      const selected = filter === 'all' ? !activeCalendars.size : activeCalendars.has(filter);
      button.classList.toggle('active', selected);
      button.setAttribute('aria-pressed', selected);
    });
    body.innerHTML = view === 'day' ? dayHTML(visible.get(key) || [], entries.filter(item => byCalendarRange(item, key)))
      : view === 'week' ? weekHTML(visible) : monthHTML(visible);
    if (planningUniversity && view === 'day') {
      body.insertAdjacentHTML('afterbegin', `<div class="day-tools"><strong>Układanie planu · ${calendarNames[planningUniversity]}</strong>
        <button class="btn soft small" type="button" data-finish-plan>Zakończ układanie</button></div>
        <p class="state-line">Kliknij godzinę w kolumnie Oliwki. Strzałkami przejdziesz do następnego dnia.</p>`);
    }
    const hints = {
      week: 'Kliknij datę, aby otworzyć dzień. Kliknij wydarzenie, aby zobaczyć szczegóły.',
      month: 'Gwiazdka oznacza ważne wydarzenie. Kliknij datę, aby zobaczyć wszystkie jej wydarzenia pod miesiącem.',
      day: highlightFree ? 'Wspólne wolne jest liczone ze wszystkich uwzględnionych planów.' : 'Kliknij wolną godzinę, aby dodać wydarzenie.'
    };
    const storageHint = storageAvailable ? '' : ' Zapis zmian działa w otwartej sesji.';
    $('#calendarHint').innerHTML = view === 'week' && !storageHint ? '' : icon('info') + escape(view === 'week' ? storageHint : hints[view] + storageHint);
    if (animate) {
      body.classList.remove('is-changing');
      void body.offsetWidth;
      body.classList.add('is-changing');
    }
  }

  function openDay(key) {
    cursor = parseDate(key);
    view = 'day';
    renderCalendar(true);
    body.focus({ preventScroll: true });
  }

  function shiftDate(direction) {
    if (view === 'month') {
      const first = localDate(cursor.getUTCFullYear(), cursor.getUTCMonth() + direction, 1);
      const maxDay = localDate(first.getUTCFullYear(), first.getUTCMonth() + 1, 0).getUTCDate();
      cursor = localDate(first.getUTCFullYear(), first.getUTCMonth(), Math.min(cursor.getUTCDate(), maxDay));
    } else {
      cursor = addDays(cursor, direction * (view === 'week' ? 7 : 1));
    }
    renderCalendar(true);
  }

  function showToast(message) {
    const toast = $('#toast');
    clearTimeout(toastTimer);
    toast.textContent = message;
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
  }

  function showDialog(title, content, options = {}) {
    dialog.classList.toggle('wide', !!options.wide);

      <button class="circle-btn" data-close type="button" aria-label="Zamknij">${icon('x')}</button></div>${content}`;
    if (!dialog.open) {
      returnFocus = document.activeElement;
      dialog.showModal();
    }
    dialog.scrollTop = 0;
    if (options.focus) $(options.focus, dialog)?.focus();
    else $('[data-close]', dialog).focus();

  function saveEntry(form) {
    const fields = new FormData(form);
    const title = fields.get('title').trim();
    const allDay = fields.has('allDay');
    const start = allDay ? '' : fields.get('start');
    const end = allDay ? '' : fields.get('end');
    const error = $('.form-error', form);
    if (!title || (!allDay && end <= start)) {
      error.textContent = !title ? 'Wpisz nazwę wydarzenia.' : 'Godzina zakończenia musi być późniejsza niż początek.';
      error.hidden = false;
      return;
    }
    const previous = data.entries.find(item => item.id === form.dataset.editId);
    const item = {
      id: previous?.id || 'entry-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      author: previous?.author || data.account,
      title, date: fields.get('date'), start, end, allDay,
      owner: fields.get('owner'), calendar: fields.get('calendar'), kind: fields.get('kind'),
      important: fields.has('important'), blocking: fields.has('blocking'),
      color: fields.get('color') || '',
      place: fields.get('place').trim(), description: fields.get('description').trim(),
      reminder: fields.get('reminder')
    };
    const repeat = Number(fields.get('repeat'));
    const until = fields.get('until');
    if (repeat && (!until || until < item.date || parseDate(until) - parseDate(item.date) > 366 * 86400000)) {
      error.textContent = 'Wybierz datę końca od pierwszych zajęć do roku później.';
      error.hidden = false;
      return;
    }
    if (previous) {
      const scope = fields.get('scope') || 'one';
      const offset = (parseDate(item.date) - parseDate(previous.date)) / 86400000;
      data.entries = data.entries.map(entry => {
        if (!inScope(entry, previous, scope)) return entry;
        return { ...item, id:entry.id, series:entry.series, originalDate:entry.originalDate,
          date:dateKey(addDays(parseDate(entry.date), offset)) };
      });
    } else if (repeat) {
      data.semesterEnd = until;
      for (let date = item.date; date <= until; date = dateKey(addDays(parseDate(date), repeat))) {
        data.entries.push({ ...item, id:item.id + '-' + date, series:item.id, originalDate:date, date });
      }
    } else {
      data.entries.push(item);
    }
    if (activeCalendars.size) activeCalendars.add(item.calendar);
    cursor = parseDate(item.date);
    saveData();
    dialog.close();
    renderCalendar();
    showToast(previous ? 'Zapisano zmiany w wydarzeniu.' : 'Dodano wydarzenie.');
  }

  function inScope(entry, selected, scope) {
    return entry.id === selected.id || Boolean(selected.series && entry.series === selected.series &&
      (scope === 'all' || (scope === 'future' && entry.originalDate >= selected.originalDate)));
  }

        <div class="form-field"><label for="toHour">A</label><input id="toHour" name="to" type="time" required value="20:00"></div>
      </div>
      <button class="btn" type="submit">Szukaj w ciągu 7 dni</button>

  function searchAvailability(form) {
    const fields = new FormData(form);
    const first = parseDate(fields.get('date'));
    const from = minutes(fields.get('from'));
    const to = minutes(fields.get('to'));
    const minimum = Number(fields.get('minimum'));
    const results = $('#availabilityResults', dialog);
    if (from >= to) {
      results.innerHTML = '<p class="form-error" role="alert">Godzina końcowa musi być późniejsza niż początkowa.</p>';
      return;
    }
    const days = entriesByDay(allEntries());
    const options = [];
    for (let day = first, i = 0; i < 7; day = addDays(day, 1), i++) {
      const key = dateKey(day);
      for (const slot of freeIntervals(days.get(key) || [], from, to, minimum)) {
        options.push({ day, key, ...slot });
      }
    }
    results.innerHTML = options.length ? `<div class="results-heading">Znalezione terminy (${options.length})</div>
      <div class="availability-results">${options.map(({ day, key, start, end }) => `<div class="availability-result">
        <div><strong>${capital(formatDate(day, { weekday: 'long', day: 'numeric', month: 'short' }))}</strong>
        <span>${hourText(start)}–${hourText(end)} · ${durationText(end - start)}</span></div>
        <button class="btn soft small" type="button" data-free-slot="${start}" data-slot-end="${Math.min(start + minimum, end)}" data-slot-date="${key}">Zaplanuj</button></div>`).join('')}</div>`
      : '<p class="note">Brak wspólnego wolnego w podanym zakresie.</p>';
  }

  function updateUsos() {
    const items = universityEntries();
    $('#usosCount', dialog).textContent = `${sourceSelection.size} z ${items.length} terminów w kalendarzu`;
    const setState = (input, related) => {
      const selected = related.filter(item => sourceSelection.has(item.id)).length;
      input.checked = selected === related.length;
      input.indeterminate = selected > 0 && selected < related.length;
      return selected;
    };
    $$('[data-type]', dialog).forEach(input => setState(input, items.filter(item => item.courseType === input.dataset.type)));
    $$('[data-course-toggle]', dialog).forEach(input => {
      const related = items.filter(item => item.course === input.dataset.courseToggle);
      const count = setState(input, related);
      $('.source-group-count', input.closest('details')).textContent = ` · ${count}/${related.length}`;
    });
    for (const item of items) {
      const input = $(`[data-source="${item.id}"]`, dialog);
      input.checked = sourceSelection.has(item.id);
      const label = input.closest('label');
      input.nextSibling.textContent = ` ${capital(formatDate(parseDate(item.date), { weekday:'short', day:'numeric', month:'short' }))} · ${itemTime(item)}`;
      $('.change', label).hidden = !item.changed;
    }
  }

  function setMobileMenu(open) {
    const sidebar = $('#sidebar');
    const isMobile = matchMedia('(max-width: 760px)').matches;
    sidebar.classList.toggle('open', open && isMobile);
    $('#mobileScrim').classList.toggle('open', open && isMobile);
    $('#mobileToggle').setAttribute('aria-expanded', String(open && isMobile));
    sidebar.inert = isMobile && !open;
    if (open && isMobile) $('.nav-item.active', sidebar).focus();
  }

  $('#viewTabs').addEventListener('click', event => {
    const tab = event.target.closest('[data-view]');
    if (!tab) return;
    view = tab.dataset.view;
    renderCalendar(true);
  });
  $$('.date-nav [data-date-nav]').forEach(button => button.addEventListener('click', () => shiftDate(Number(button.dataset.dateNav))));
  $('#todayButton').addEventListener('click', () => { cursor = today; renderCalendar(true); });
  $('#addButton').addEventListener('click', () => openEditor());
  $('#usosButton').addEventListener('click', showUsos);
  $('#accountButton').addEventListener('click', showAccount);
  $('#availabilityButton').addEventListener('click', showAvailability);
  $('#mobileToggle').addEventListener('click', () => setMobileMenu(true));
  $('#mobileScrim').addEventListener('click', () => { setMobileMenu(false); $('#mobileToggle').focus(); });
  $('#sidebar .nav-item.active').addEventListener('click', () => setMobileMenu(false));
  matchMedia('(max-width: 760px)').addEventListener('change', () => setMobileMenu(false));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && $('#sidebar').classList.contains('open')) {
      setMobileMenu(false);
      $('#mobileToggle').focus();
    }
  });
  $('#filterBar').addEventListener('click', event => {
    const filter = event.target.closest('[data-calendar-filter]')?.dataset.calendarFilter;
    if (!filter) return;
    if (filter === 'all') activeCalendars.clear();
    else if (activeCalendars.has(filter)) activeCalendars.delete(filter);
    else activeCalendars.add(filter);
    renderCalendar();
  });

  function useTimeSlot(button) {
    const start = Number(button.dataset.freeSlot);
    const slotEnd = Number(button.dataset.slotEnd);
    const end = Math.min(button.dataset.slotDate ? slotEnd : Math.min(start + 60, slotEnd), 1439);
    openEditor(null, { date: button.dataset.slotDate || dateKey(cursor), owner: 'shared', start: hourText(start), end: hourText(end) });
  }

  body.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button) return;
    const action = button.dataset;
    if (action.finishPlan !== undefined) { planningUniversity = ''; activeCalendars.clear(); renderCalendar(); }
    if (action.event) detail(action.event);
    if (action.openDay) openDay(action.openDay);
    if (action.monthDay) {
      cursor = parseDate(action.monthDay);
      renderCalendar();
      $(`[data-month-day="${action.monthDay}"]`, body)?.focus({preventScroll:true});
    }
    if (action.freeSlot) useTimeSlot(button);
    if (action.addHour !== undefined) {
      const hour = Number(action.addHour);
      if (planningUniversity && action.owner !== 'oliwia') return;
      openEditor(null, { owner: action.owner, university: planningUniversity, start: hourText(hour * 60), end: hourText(Math.min((hour + 1) * 60, 1439)) });
    }
  });
  body.addEventListener('change', event => {
    if (event.target.id !== 'highlightFree') return;
    highlightFree = event.target.checked;
    renderCalendar();
    $('#highlightFree').focus();
  });

  dialog.addEventListener('click', event => {
    if (event.target === dialog) {
      const rect = dialog.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
      return;
    }
    const button = event.target.closest('button');
    if (!button) return;
    const action = button.dataset;
    if (action.close !== undefined) dialog.close();
    else if (action.account) {
      data.account = action.account;
      saveData();
      dialog.close();
      renderAccount();
      showToast(`Wybrano konto: ${names[data.account]}.`);
    } else if (action.event) detail(action.event);
    else if (action.edit) openEditor(data.entries.find(item => item.id === action.edit));
    else if (action.delete) confirmDelete(action.delete);
    else if (action.confirmDelete) {
      const selected = data.entries.find(item => item.id === action.confirmDelete);
      if (!selected) return;
      data.entries = data.entries.filter(item => !inScope(item, selected, $('#deleteScope', dialog)?.value || 'one'));
      saveData();
      dialog.close();
      renderCalendar();
      showToast('Usunięto wydarzenie.');
    } else if (action.hideImport) {
      data.hidden = [...new Set([...data.hidden, action.hideImport])];
      saveData();
      dialog.close();
      renderCalendar();
      showToast('Pominięto termin. Włączysz go ponownie w sekcji Uczelnie.');
    } else if (action.freeSlot) useTimeSlot(button);
    else if (action.plan) startPlanning(action.plan);
    else if (action.university) { selectedUniversity = action.university; showUsos(); }
    else if (button.id === 'openUsos') showUsos();
    else if (button.id === 'saveUsos') {
      data.hidden = [
        ...data.hidden.filter(id => !universityEntries().some(item => item.id === id)),
        ...universityEntries().filter(item => !sourceSelection.has(item.id)).map(item => item.id)
      ];
      saveData();
      dialog.close();
      renderCalendar();
      showToast('Zapisano wybór zajęć.');
    }
  });
  dialog.addEventListener('change', event => {
    const field = event.target;
    if (field.id === 'repeat') $('#repeatEnd', dialog).hidden = field.value === '0';
    if (field.id === 'allDay') {
      $('#eventTimes', dialog).hidden = field.checked;
      $$('#eventTimes input', dialog).forEach(input => { input.disabled = field.checked; });
      return;
    }
    const { source, type, courseToggle } = field.dataset;
    if (!source && !type && !courseToggle) return;
    const items = sourceEntries().filter(item => item.id === source || item.courseType === type || item.course === courseToggle);
    for (const item of items) {
      if (field.checked) sourceSelection.add(item.id);
      else sourceSelection.delete(item.id);
    }
    updateUsos();
  });
  dialog.addEventListener('submit', event => {
    event.preventDefault();
    if (event.target.id === 'eventForm') saveEntry(event.target);
    else if (event.target.id === 'availabilityForm') searchAvailability(event.target);
  });

  setMobileMenu(false);
  renderAccount();
  renderCalendar();
})();

</script>
</body>
</html>
