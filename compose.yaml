name: razem-calendar
services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: razem
      MARIADB_USER: razem
      MARIADB_PASSWORD: ${DB_PASSWORD:?Uruchom npm run calendar:local}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - calendar-data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-calendar.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 4s
      timeout: 4s
      retries: 30
  web:
    build: ./backend
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
    environment:
      CALENDAR_LOCAL: "1"
      DB_PASSWORD: ${DB_PASSWORD}
      SZYMEK_PASSWORD: ${SZYMEK_PASSWORD}
      OLIWUSIA_PASSWORD: ${OLIWUSIA_PASSWORD}
      AGH_URL: ${AGH_URL:-}
    volumes:
      - ./out:/var/www/html:ro
      - ./backend:/var/www/razem:ro
volumes:
  calendar-data:
